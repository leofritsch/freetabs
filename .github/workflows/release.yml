name: Release

# Push a tag like v0.2.0 (matching the version in package.json, public/manifest.json
# and mcp/package.json). This builds both files and attaches them to a GitHub
# release. FreeTabs' "Download for Claude Desktop" link always points at the newest
# release's freetabs.mcpb.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: node scripts/check-version.mjs "${GITHUB_REF_NAME#v}"
      - run: npm test
      - run: npm run zip
      - name: Attach freetabs.mcpb and freetabs.zip to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/freetabs.mcpb release/freetabs.zip --title "FreeTabs $GITHUB_REF_NAME" --generate-notes
