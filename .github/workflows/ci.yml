name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mcp
      - run: npm run typecheck
      - run: npm test
      # Builds the extension and packs freetabs.mcpb, so a broken bundle fails here too.
      - run: npm run build
